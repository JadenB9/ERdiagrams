<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Draw entity-relationship diagrams with weak entities and identifying relationships, then export PNG, SVG or a SQL schema.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141414">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#1e1e1e">
  <title>ER Diagram Builder</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="toolbar" role="toolbar" aria-label="Diagram tools">
      <button class="tbtn active" data-tool="select" aria-pressed="true" title="Select &amp; move elements. Drag empty canvas to pan, Shift+drag to box-select. (V)">
        <svg class="ticon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3 2l9.5 7.6-4 .7 2.3 3.7-1.8 1-2.3-3.7L3.9 14z"/></svg> Select
      </button>
      <button class="tbtn" data-tool="connect" aria-pressed="false" title="Click two elements to draw a line between them. (C)">
        <svg class="ticon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="3.5" cy="12.5" r="1.8"/><circle cx="12.5" cy="3.5" r="1.8"/><path d="M5 11l6-6"/></svg> Connect
      </button>
      <div class="tsep"></div>
      <button class="tbtn" data-tool="entity" aria-pressed="false" title="Click canvas to place a strong entity rectangle. (E)">
        <svg class="ticon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="3.5" width="12" height="9" rx="1"/></svg> Entity
      </button>
      <button class="tbtn" data-tool="weak-entity" aria-pressed="false" title="Click canvas to place a weak entity (double border). (W)">
        <svg class="ticon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1"/><rect x="4.2" y="5.2" width="7.6" height="5.6" rx=".5"/></svg> Weak Entity
      </button>
      <button class="tbtn" data-tool="relationship" aria-pressed="false" title="Click canvas to place a relationship diamond. (R)">
        <svg class="ticon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M8 2l6 6-6 6-6-6z"/></svg> Relationship
      </button>
      <button class="tbtn" data-tool="identifying-rel" aria-pressed="false" title="Click canvas to place an identifying relationship (double diamond). (I)">
        <svg class="ticon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.5l6.5 6.5-6.5 6.5L1.5 8z"/><path d="M8 4.8L11.2 8 8 11.2 4.8 8z"/></svg> Ident. Rel.
      </button>
      <div class="tsep"></div>
      <button class="tbtn" id="undo-btn" title="Undo (Ctrl/Cmd+Z)" disabled>
        <svg class="ticon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7.5h6.5a3 3 0 0 1 0 6H6"/><path d="M6.5 4.5L3.5 7.5l3 3"/></svg> Undo
      </button>
      <button class="tbtn" id="redo-btn" title="Redo (Ctrl/Cmd+Shift+Z)" disabled>
        <svg class="ticon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7.5H5.5a3 3 0 0 0 0 6H10"/><path d="M9.5 4.5l3 3-3 3"/></svg> Redo
      </button>
      <button class="tbtn" id="delete-btn" title="Delete the selection. (Del)">
        <svg class="ticon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 9h5.8l.6-9"/></svg> Delete
      </button>
      <button class="tbtn" id="layout-btn" title="Arrange the whole diagram automatically. (L)">
        <svg class="ticon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.5" y="2" width="5" height="4" rx=".8"/><rect x="9.5" y="2" width="5" height="4" rx=".8"/><rect x="5.5" y="10" width="5" height="4" rx=".8"/><path d="M4 6v2h8V6M8 8v2"/></svg> Layout
      </button>
      <div class="tsep"></div>
      <details class="tmenu">
        <summary class="tbtn"><svg class="ticon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M4 2h5.5L13 5.5V14H4z"/><path d="M9.5 2v3.5H13"/></svg> File</summary>
        <div class="tmenu-list">
          <span class="tmenu-head">Examples</span>
          <button class="example-btn" id="example-btn" data-sample="mlb">MLB baseball (HW7)</button>
          <button class="example-btn" data-sample="university">University</button>
          <button class="example-btn" data-sample="store">Online store</button>
          <div class="tmenu-sep"></div>
          <button id="open-btn">Open .json&hellip;</button>
          <button id="save-btn">Save .json</button>
          <button id="clear-btn" class="danger">Clear canvas</button>
        </div>
      </details>
      <details class="tmenu">
        <summary class="tbtn"><svg class="ticon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10V2.5M5 5.5l3-3 3 3"/><path d="M3 9.5v4h10v-4"/></svg> Export</summary>
        <div class="tmenu-list">
          <button id="export-png-btn">PNG image</button>
          <button id="export-svg-btn">SVG image</button>
          <button id="export-sql-btn">SQL schema (.sql)</button>
          <label class="tmenu-check" title="Images come out light unless this is on and the dark theme is showing"><input type="checkbox" id="export-dark"> Use on-screen colors</label>
        </div>
      </details>
      <button class="tbtn" id="theme-btn" title="Switch light / dark theme" aria-label="Switch light / dark theme">
        <svg class="ticon theme-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M3.4 12.6l1.3-1.3M11.3 4.7l1.3-1.3"/></svg>
        <svg class="ticon theme-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7z"/></svg>
        Theme
      </button>
      <input type="file" id="open-input" accept=".json,application/json" hidden>
    </div>

    <div id="workspace">
      <div id="canvas-wrap">
        <svg id="canvas" xmlns="http://www.w3.org/2000/svg" tabindex="0" role="application"
             aria-label="Diagram canvas. Arrow keys move the selected element, ] and [ step through elements, Delete removes it.">
          <defs>
            <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
              <path class="grid-line" d="M 20 0 L 0 0 0 20" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
            </pattern>
          </defs>
          <rect id="grid-bg" x="-10000" y="-10000" width="30000" height="30000" fill="url(#grid)"/>
          <g id="connections-layer"></g>
          <g id="elements-layer"></g>
          <g id="overlay-layer"></g>
        </svg>
        <div id="zoom-controls">
          <button class="zbtn" id="zoom-in-btn" title="Zoom in (+)" aria-label="Zoom in">+</button>
          <button class="zbtn" id="zoom-out-btn" title="Zoom out (-)" aria-label="Zoom out">&minus;</button>
          <button class="zbtn" id="zoom-fit-btn" title="Fit diagram (Space)" aria-label="Fit diagram to view">Fit</button>
        </div>
        <div id="status" role="status" aria-live="polite"></div>
      </div>

      <div id="resize-handle" title="Drag to resize panel"></div>

      <div id="side-panel">
        <div id="props-section">
          <h3>Properties</h3>
          <div id="props-content"></div>
        </div>
        <div id="text-resize-handle" title="Drag to resize text area"></div>
        <div id="text-section" class="collapsed">
          <h3 id="text-toggle" role="button" tabindex="0" aria-expanded="false"><span class="toggle-arrow" aria-hidden="true">&#9654;</span> Code</h3>
          <div id="tab-bar" role="tablist">
            <button class="tab-btn active" data-tab="er" role="tab" aria-selected="true">ER Notation</button>
            <button class="tab-btn" data-tab="schema" role="tab" aria-selected="false">DB Schema</button>
            <button class="small-btn" id="render-btn" title="Parse ER notation and replace the diagram">Render</button>
          </div>
          <div class="tab-pane active" id="pane-er">
            <textarea id="er-input" spellcheck="false" aria-label="ER notation" placeholder="ENTITY Student: *id, name, {email}, age()&#10;WEAK Grade: ~term, letter&#10;IDENT earns (Student, Grade) 1:N partial/total"></textarea>
            <button class="copy-btn" data-target="er-input" title="Copy to clipboard">Copy</button>
          </div>
          <div class="tab-pane" id="pane-schema">
            <textarea id="schema-output" spellcheck="false" readonly aria-label="Generated SQL schema" placeholder="SQL schema auto-generates from the diagram..."></textarea>
            <button class="copy-btn" data-target="schema-output" title="Copy to clipboard">Copy</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="mlb.js"></script>
  <script src="samples.js"></script>
  <script src="app.js"></script>
</body>
</html>
